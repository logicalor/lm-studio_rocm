[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=lmstudio

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autorestart=true
priority=100
user=lmstudio
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=200
user=lmstudio
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=300
user=lmstudio
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autorestart=true
priority=400
user=lmstudio
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:lmstudio]
command=/opt/lm-studio.AppImage --appimage-extract-and-run --no-sandbox
directory=/opt
environment=DISPLAY=":99",HSA_OVERRIDE_GFX_VERSION="%(ENV_HSA_OVERRIDE_GFX_VERSION)s",HIP_VISIBLE_DEVICES="all",LD_LIBRARY_PATH="/opt/rocm/lib:/opt/rocm/lib64",ROCM_PATH="/opt/rocm",HIP_PLATFORM="amd",HOME="/home/lmstudio"
autorestart=true
priority=500
user=lmstudio
stdout_logfile=/var/log/supervisor/lmstudio.log
stderr_logfile=/var/log/supervisor/lmstudio_err.log
